<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-label="FLY TAN ASCII banner">
  <title>FLY TAN ASCII</title>
  <style>
    .a {
      font-family: "SF Mono", "Consolas", "Courier New", monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #58a6ff;
    }
    .b { fill: #a371f7; }
    .c { fill: #3fb950; }
    .bg { fill: none; stroke: #30363d; stroke-width: 1; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="419" height="209" rx="6"/>

  <g>
    <text class="a" x="18" y="30">███████╗██╗  ██╗   ████████╗ █████╗ ███╗   ██╗</text>
    <text class="a" x="18" y="48">██╔════╝██║  ██║   ╚══██╔══╝██╔══██╗████╗  ██║</text>
    <text class="a" x="18" y="66">█████╗  ███████║█████╗██║   ███████║██╔██╗ ██║</text>
    <text class="a" x="18" y="84">██╔══╝  ██╔══██║╚════╝██║   ██╔══██║██║╚██╗██║</text>
    <text class="a" x="18" y="102">██║     ██║  ██║      ██║   ██║  ██║██║ ╚████║</text>
    <text class="a" x="18" y="120">╚═╝     ╚═╝  ╚═╝      ╚═╝   ╚═╝  ╚═╝╚═╝  ╚═══╝</text>
  </g>

  <!-- sweeping scanline highlight -->
  <rect x="10" y="170" width="80" height="2" rx="1" fill="#3fb950" opacity="0.9">
    <animate attributeName="x" values="10;330;10" dur="6s" repeatCount="indefinite"/>
  </rect>

  <g>
    <text class="a c" x="18" y="192" font-size="10">&gt; student dev</text>
    <text class="a b" x="150" y="192" font-size="10">hackathons</text>
    <text class="a c" x="252" y="192" font-size="10">malaysia</text>
    <rect x="320" y="182" width="6" height="12" fill="#58a6ff">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
