<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" width="820" height="380" role="img" aria-label="FLY TAN animated CTF wordmark">
  <title>FLY TAN // CTF</title>

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff88">
        <animate attributeName="stop-color" values="#00ff88;#38bdf8;#a855f7;#00ff88" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#a855f7;#00ff88;#38bdf8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#00ff88;#38bdf8;#a855f7" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="45%" stop-color="#00ff88" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#00ff88" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M26 0 L0 0 0 26" fill="none" stroke="#00ff88" stroke-width="0.5" opacity="0.13"/>
    </pattern>

    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="box"><rect x="1" y="1" width="818" height="378" rx="10"/></clipPath>
  </defs>

  <style>
    .word { font-family:"Segoe UI",-apple-system,Roboto,Arial,sans-serif; font-size:104px; font-weight:800; letter-spacing:9px; fill:url(#grad); }
    .mono { font-family:"SF Mono",Consolas,"Courier New",monospace; fill:#00ff88; }
    .dim  { fill:#3d5a4a; }
  </style>

  <!-- frame -->
  <rect x="1" y="1" width="818" height="378" rx="10" fill="#0a0f0d"/>
  <g clip-path="url(#box)">
    <rect width="820" height="380" fill="url(#grid)"/>

    <!-- drifting binary columns -->
    <g class="mono" font-size="12" opacity="0.30">
      <text x="24" y="-10">01101<animateTransform attributeName="transform" type="translate" from="0 -60" to="0 440" dur="14s" repeatCount="indefinite"/>0110</text>
      <text x="96" y="-10">11010<animateTransform attributeName="transform" type="translate" from="0 -160" to="0 460" dur="19s" repeatCount="indefinite"/>1001</text>
      <text x="168" y="-10">00111<animateTransform attributeName="transform" type="translate" from="0 -20" to="0 420" dur="11s" repeatCount="indefinite"/>0110</text>
      <text x="250" y="-10">10110<animateTransform attributeName="transform" type="translate" from="0 -200" to="0 470" dur="23s" repeatCount="indefinite"/>1011</text>
      <text x="330" y="-10">01001<animateTransform attributeName="transform" type="translate" from="0 -90" to="0 430" dur="16s" repeatCount="indefinite"/>1100</text>
      <text x="410" y="-10">11100<animateTransform attributeName="transform" type="translate" from="0 -240" to="0 480" dur="26s" repeatCount="indefinite"/>0101</text>
      <text x="492" y="-10">10011<animateTransform attributeName="transform" type="translate" from="0 -50" to="0 440" dur="13s" repeatCount="indefinite"/>0110</text>
      <text x="574" y="-10">01110<animateTransform attributeName="transform" type="translate" from="0 -180" to="0 460" dur="21s" repeatCount="indefinite"/>1001</text>
      <text x="656" y="-10">11001<animateTransform attributeName="transform" type="translate" from="0 -110" to="0 430" dur="17s" repeatCount="indefinite"/>1010</text>
      <text x="738" y="-10">00110<animateTransform attributeName="transform" type="translate" from="0 -260" to="0 490" dur="25s" repeatCount="indefinite"/>0111</text>
    </g>

    <!-- moving scanline -->
    <rect x="0" y="-90" width="820" height="90" fill="url(#scan)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 470" dur="4.5s" repeatCount="indefinite"/>
    </rect>

    <!-- top banner -->
    <g class="mono" font-size="12" letter-spacing="3">
      <text x="26" y="30">[ FLY-TAN ]</text>
      <text x="26" y="30" opacity="0">[ FLY-TAN ]
        <animate attributeName="opacity" values="1;1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
      </text>
      <text x="620" y="30">SECURE_SHELL</text>
      <circle cx="790" cy="26" r="5" fill="#00ff88">
        <animate attributeName="fill" values="#00ff88;#ff3b3b;#00ff88" dur="1.6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- main wordmark: letters drop in with bounce -->
    <g filter="url(#neon)">
      <text class="word" x="58" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.1s" fill="freeze"/>F
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="0.1s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
      <text class="word" x="145" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.28s" fill="freeze"/>L
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="0.28s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
      <text class="word" x="222" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.46s" fill="freeze"/>Y
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="0.46s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
      <text class="word" x="352" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.78s" fill="freeze"/>T
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="0.78s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
      <text class="word" x="440" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="0.96s" fill="freeze"/>A
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="0.96s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
      <text class="word" x="530" y="196" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.45s" begin="1.14s" fill="freeze"/>N
        <animateTransform attributeName="transform" type="translate" from="0 -70" to="0 0" dur="0.7s" begin="1.14s" calcMode="spline" keySplines="0.3 0 0.2 1" fill="freeze"/>
      </text>
    </g>

    <!-- blinking block cursor -->
    <rect x="628" y="118" width="10" height="86" fill="#00ff88" opacity="0">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" begin="1.6s" repeatCount="indefinite"/>
    </rect>

    <!-- caret on tagline -->
    <text class="mono" x="58" y="262" font-size="17" letter-spacing="2.5" opacity="0">&gt; flags_collected: 0x7F3A<animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2s" fill="freeze"/></text>
    <rect x="392" y="248" width="9" height="17" fill="#00ff88">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- flag badge sliding in -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="2.5s" fill="freeze"/>
      <rect x="58" y="286" width="236" height="34" rx="4" fill="none" stroke="#00ff88" stroke-width="1.4" opacity="0.85">
        <animate attributeName="stroke-dasharray" values="0 540;540 0" dur="1.6s" begin="2.5s" fill="freeze"/>
      </rect>
      <text class="mono" x="74" y="309" font-size="15" letter-spacing="2">FLAG{f1y_t4n_0wn5}</text>
    </g>

    <!-- scrolling alert ticker -->
    <g class="mono" font-size="13" letter-spacing="2" opacity="0.9">
      <text x="820" y="352">[+] ctf · hackathons · student dev · malaysia · [+] ctf · hackathons · student dev · malaysia
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-720 0" dur="18s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- corner brackets -->
    <g stroke="#00ff88" stroke-width="2.4" fill="none">
      <path d="M14 44 L14 14 L44 14"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M776 14 L806 14 L806 44"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M806 336 L806 366 L776 366"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M44 366 L14 366 L14 336"><animate attributeName="opacity" values="1;0.4;1" dur="2.4s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <rect x="1" y="1" width="818" height="378" rx="10" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.5"/>
</svg>
