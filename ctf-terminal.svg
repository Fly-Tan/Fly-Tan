<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 230" width="460" height="230" role="img" aria-label="CTF terminal with typing animation">
  <title>CTF terminal</title>

  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="48%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="52%" stop-color="#00ff88" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="term"><rect x="1" y="1" width="458" height="228" rx="7"/></clipPath>
  </defs>

  <style>
    .t { font-family:"SF Mono",Consolas,"Courier New",monospace; font-size:12.5px; letter-spacing="0.4"; }
    .g { fill:#00ff88; }
    .c { fill:#38bdf8; }
    .y { fill:#ffd257; }
    .m { fill:#7d8f86; }
    .r { fill:#ff5f56; }
  </style>

  <rect x="1" y="1" width="458" height="228" rx="7" fill="#0a0f0d"/>
  <g clip-path="url(#term)">
    <!-- scan sweep -->
    <rect x="0" y="-70" width="460" height="70" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="0 300" dur="3.6s" repeatCount="indefinite"/>
    </rect>

    <!-- title bar -->
    <rect x="0" y="0" width="460" height="24" fill="#111814"/>
    <circle cx="18" cy="12" r="4" class="r"><animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="33" cy="12" r="4" fill="#ffbd2e"/>
    <circle cx="48" cy="12" r="4" fill="#27c93f"/>
    <text class="t m" x="70" y="16">fly-tan@ctf: ~/flags</text>

    <!-- typed lines appearing in sequence -->
    <text class="t g" x="14" y="50" opacity="0">$ whoami<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.2s" fill="freeze"/></text>
    <text class="t c" x="14" y="70" opacity="0">student_dev · hackathon_addict<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="0.9s" fill="freeze"/></text>

    <text class="t g" x="14" y="96" opacity="0">$ cat flag.txt<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="1.5s" fill="freeze"/></text>
    <text class="t y" x="14" y="116" opacity="0">FLAG{s0lv3d_1n_48h}<animate attributeName="opacity" values="0;0.2;1;0.2;1" dur="2.6s" begin="2s" fill="freeze"/></text>

    <text class="t g" x="14" y="142" opacity="0">$ ./exploit --target h4ck4th0n<animate attributeName="opacity" from="0" to="1" dur="0.25s" begin="2.8s" fill="freeze"/></text>

    <!-- progress bar filling -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="3.2s" fill="freeze"/>
      <rect x="14" y="152" width="180" height="10" rx="2" fill="none" stroke="#00ff88" stroke-width="1" opacity="0.55"/>
      <rect x="16" y="154" width="0" height="6" rx="1" fill="#00ff88">
        <animate attributeName="width" values="0;176" dur="2.4s" begin="3.3s" repeatCount="indefinite"/>
      </rect>
      <text class="t m" x="204" y="161" font-size="11">[■■■■■■■■] 100%</text>
    </g>

    <text class="t g" x="14" y="188" opacity="0">root@ctf:~# <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="5.6s" fill="freeze"/></text>
    <rect x="112" y="176" width="8" height="14" fill="#00ff88">
      <animate attributeName="opacity" values="1;1;0;0" dur="0.95s" repeatCount="indefinite"/>
    </rect>

    <!-- bottom ticker -->
    <text class="t m" x="460" y="216" font-size="10.5" letter-spacing="1.5">ACCESS_GRANTED · ACCESS_GRANTED · ACCESS_GRANTED · ACCESS_GRANTED
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-380 0" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="1" y="1" width="458" height="228" rx="7" fill="none" stroke="#00ff88" stroke-width="1.2" opacity="0.55"/>
</svg>
